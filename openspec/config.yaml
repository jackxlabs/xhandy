schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Xhandy (repository x-helper), a Chromium Manifest V3 extension for people who use X by hand.
  No build step: the repository root is the extension directory. Read CLAUDE.md (Chinese) for the full rules.

  Rules that no change may break:
  - Xhandy never acts for the user: it never clicks, types, sends, likes, follows or unfollows, and does
    nothing in bulk. It only reads the page and the user's own actions, then shows hints. The follow
    assistant only moves focus to X's own Follow button; the user presses Enter.
  - No fake input events, no masking of the fetch hook (src/page-hook.js only clones X's own responses).
  - Offline by default: no network requests, analytics or remote code. Any network feature is off until
    the user turns it on in settings, asks for access through optional_host_permissions at that moment,
    and sends requests from the background service worker, never from content scripts.
  - User data lives only in chrome.storage.local (IndexedDB later, opened in the service worker only).
    A change to what is stored updates README "Privacy" and PRIVACY.md.
  - Storage: one key per part (xh:settings, xh:people, xh:sent, xh:days, xh:rel, xh:relMeta, xh:replied,
    xh:inSeen, xh:pace, xh:keys; PARTS in src/lib/store.js is the source of truth), writes via
    store.update([parts], fn). Schema changes add DEFAULTS, bump VERSION with a migrate() step and a
    migration test; old exports must still import.
  - Soft limits only remind, never block.
  - The UI ships in Chinese and English (src/lib/i18n.js, _locales/). Chinese and English users are equal.
  - X selectors live in SEL at the top of src/content.js; changing one updates test/fixtures/.

  This repository is public. Never write private business plans (pricing, payments, subscriptions,
  revenue) into openspec/; those stay outside the repository.

  Tests: `npm test` (node --test) and `CHROMIUM=/usr/bin/chromium npm run e2e` (real Chromium, fake
  timeline, never touches real X). Both must pass.

rules:
  proposal:
    - State what is out of scope.
    - Say how the change keeps the rules above (acting for the user, network, storage).
  tasks:
    - Each task ends with something verifiable (a unit test, an e2e step or a named manual check).
    - Keep tasks small enough to review as one diff.

operations:
  apply:
    guidance:
      - Run npm test and the e2e suite before reporting a task done, and include the pass/fail counts.
        If you were told not to run shell commands, say so in the report; the reviewer runs them.
      - Re-read every file you are about to change, even if you saw it earlier, because the reviewer often
        edits code between task groups.
      # Lessons from review (2026-10-20). Each of these cost a review round at least once.
      - Do not add hooks, wrappers or expando properties on X's objects (fetch, XMLHttpRequest, DOM
        nodes) beyond the ones page-hook.js already has. Extend the existing open()/fetch wrappers.
      - The content script runs in an isolated world, so page code and page.evaluate() in e2e cannot see
        XH or the extension's storage. In e2e, read and change storage through the helpers in
        test/e2e.mjs (storedSent, storedPart, updateSettings), which use the extension's options page.
      - In e2e, two sends with the same text within 1.5 s count as one (click + Ctrl+Enter guard).
        Pause at least 1.6 s between identical sends, as a person would.
      - page-hook.js emits outcomes after X's own promise settles. In unit tests, await a flush
        (setTimeout 0) before asserting on emitted events, and install fakes (fetch, XHR) before the
        hook code runs, not after.
      - Do not assume the order of collected results (Maps walked from JSON); assert by content.
      - Node has a read-only global navigator, so set it with Object.defineProperty, not assignment.
      - When adding a field to the event payload or to cleanRelations' result, update the existing
        tests that compare whole objects (deepStrictEqual) in test/store.test.js.
      - Test fixtures use invented accounts, ids and text only, shaped like the real structure
        described in the change's design.md. Never copy real X responses.
      - Keep badge chips short, since X's name row truncates long badges. Follower counts use XH.kNum.
      - Never edit or weaken the e2e steps "extension never clicks anything by itself" and
        "extension never fakes mouse or pointer events".
      - Test handles must be valid X handles (letters, digits and underscore, at most 15 characters),
        or validation drops them and the step times out.
      - Do not commit or push; leave changes in the working tree for review.
      - When finished, write a short report of what changed, which files, and test results.
