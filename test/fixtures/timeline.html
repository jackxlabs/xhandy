<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fake timeline</title>
    <style>
      /* Rough X look so screenshots are meaningful */
      body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, "Noto Sans CJK SC", sans-serif; background: #fff; color: #0f1419; }
      body.dark { background: #000; color: #e7e9ea; }
      main { width: 600px; margin: 0 auto; border-left: 1px solid #eff3f4; border-right: 1px solid #eff3f4; min-height: 100vh; }
      body.dark main { border-color: #2f3336; }
      article { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eff3f4; }
      body.dark article { border-color: #2f3336; }
      article:focus { outline: none; background: rgba(127,127,127,.06); }
      article > *:not([data-testid="Tweet-User-Avatar"]) { grid-column: 2; }
      [data-testid="Tweet-User-Avatar"] { grid-row: 1 / span 4; }
      .av { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #1d9bf0; color: #fff; text-decoration: none; font-weight: 700; }
      [data-testid="User-Name"] { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
      [data-testid="User-Name"] a { color: inherit; text-decoration: none; }
      [data-testid="User-Name"] a:first-child { font-weight: 700; }
      [data-testid="User-Name"] a + a { color: #536471; }
      article p { margin: 2px 0 6px; }
      article button { margin-right: 8px; }
      [role="dialog"] { width: 600px; margin: 12px auto; }
      [data-testid="tweetTextarea_0"] { min-height: 40px; border: 1px solid #cfd9de; border-radius: 8px; padding: 8px; }
      [data-testid="HoverCard"] { position: absolute; width: 260px; padding: 14px; border-radius: 14px; background: inherit; box-shadow: 0 0 12px rgba(101,119,134,.3); background: #fff; color: #0f1419; }
      body.dark [data-testid="HoverCard"] { background: #000; color: #e7e9ea; box-shadow: 0 0 12px rgba(255,255,255,.2); }
      [data-testid$="-follow"], [data-testid$="-unfollow"] { padding: 6px 16px; border-radius: 999px; border: 0; font-weight: 700; background: #0f1419; color: #fff; }
    </style>
  </head>
  <body>
    <!-- Minimal copy of the X DOM attributes x-helper relies on. Times are filled in by the script below. -->
    <main>
      <article data-testid="tweet" id="fresh" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><a href="/alice" class="av">A</a></div>
        <div data-testid="User-Name">
          <a href="/alice">Alice</a>
          <a href="/alice/status/111"><time id="t-fresh"></time></a>
        </div>
        <p>fresh post</p>
        <button data-testid="reply">reply</button>
        <button data-testid="like">like</button>
      </article>
      <article data-testid="tweet" id="old" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><a href="/bob" class="av">B</a></div>
        <div data-testid="User-Name">
          <a href="/bob">Bob</a>
          <a href="/bob/status/222"><time id="t-old"></time></a>
        </div>
        <p>old post</p>
        <button data-testid="reply">reply</button>
        <button data-testid="like">like</button>
      </article>
      <article data-testid="tweet" id="dan" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><a href="/dan" class="av">D</a></div>
        <div data-testid="User-Name">
          <a href="/dan">Dan</a>
          <a href="/dan/status/555"><time id="t-dan"></time></a>
        </div>
        <p>dan post</p>
      </article>
      <article data-testid="tweet" id="carol">
        <div data-testid="Tweet-User-Avatar"><a href="/carol" class="av">C</a></div>
        <div data-testid="User-Name">
          <a href="/carol">Carol</a>
          <a href="/carol/status/444"><time id="t-carol"></time></a>
        </div>
        <p>carol post</p>
      </article>
    </main>
    <div role="dialog" id="composer">
      <div data-testid="tweetTextarea_0" contenteditable="true" role="textbox"></div>
      <button data-testid="tweetButton">Reply</button>
    </div>
    <script>
      // Like X: timeline data arrives via fetch and XHR, before the content script has loaded.
      fetch("/i/api/graphql/abc/HomeTimeline").then((r) => r.json());
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "/i/api/graphql/def/UserTweets");
      xhr.send();
      document.getElementById("t-dan").setAttribute("datetime", new Date(Date.now() - 1800e3).toISOString());
      // Like X: hovering an avatar opens a hover card with the author's Follow button.
      const ids = { alice: "1", bob: "2", carol: "3", dan: "8" };
      document.addEventListener("mouseover", (e) => {
        const a = e.target.closest('[data-testid="Tweet-User-Avatar"] a');
        if (!a || document.querySelector('[data-testid="HoverCard"]')) return;
        const h = a.getAttribute("href").slice(1);
        setTimeout(() => {
          const card = document.createElement("div");
          card.dataset.testid = "HoverCard";
          const r = a.getBoundingClientRect();
          card.style.left = r.left + "px";
          card.style.top = r.bottom + window.scrollY + 6 + "px";
          card.innerHTML = `<b>@${h}</b><p>bio of ${h}</p><button data-testid="${ids[h]}-follow">Follow</button>`;
          card.querySelector("button").addEventListener("click", (ev) => (ev.target.dataset.testid = ids[h] + "-unfollow"));
          document.body.appendChild(card);
        }, 300);
      });
      document.addEventListener("mouseout", (e) => {
        if (e.target.closest('[data-testid="Tweet-User-Avatar"]')) document.querySelector('[data-testid="HoverCard"]')?.remove();
      });
      if (location.search.includes("theme=dark")) document.body.classList.add("dark");
      document.getElementById("t-carol").setAttribute("datetime", new Date(Date.now() - 600e3).toISOString());
      document.getElementById("t-fresh").setAttribute("datetime", new Date(Date.now() - 2 * 3600e3).toISOString());
      document.getElementById("t-old").setAttribute("datetime", new Date(Date.now() - 3 * 86400e3).toISOString());
      // Like X: "l" on a focused post toggles like <-> unlike.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "l" || e.target.closest("[contenteditable]")) return;
        const btn = document.activeElement.closest("article")?.querySelector('[data-testid="like"],[data-testid="unlike"]');
        if (btn) btn.dataset.testid = btn.dataset.testid === "like" ? "unlike" : "like";
      });
      // Like X: the composer is cleared after send. Done synchronously because headless
      // Chromium throttles timers, which made a delayed clear wipe the next test input.
      document.querySelector('[data-testid="tweetButton"]').addEventListener("click", () => {
        document.querySelector('[data-testid="tweetTextarea_0"]').textContent = "";
      });
    </script>
  </body>
</html>
