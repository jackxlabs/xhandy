<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fake timeline</title>
    <style>
      /* Rough X look so screenshots are meaningful */
      body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, "Noto Sans CJK SC", sans-serif; background: #fff; color: #0f1419; }
      body.dark { background: #000; color: #e7e9ea; }
      main { width: 600px; margin: 0 auto; border-left: 1px solid #eff3f4; border-right: 1px solid #eff3f4; min-height: 100vh; }
      body.dark main { border-color: #2f3336; }
      article { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eff3f4; }
      body.dark article { border-color: #2f3336; }
      article:focus { outline: none; background: rgba(127,127,127,.06); }
      article > *:not([data-testid="Tweet-User-Avatar"]) { grid-column: 2; }
      [data-testid="Tweet-User-Avatar"] { grid-row: 1 / span 4; }
      .av { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #1d9bf0; color: #fff; text-decoration: none; font-weight: 700; }
      [data-testid="User-Name"] { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
      [data-testid="User-Name"] a { color: inherit; text-decoration: none; }
      [data-testid="User-Name"] a:first-child { font-weight: 700; }
      [data-testid="User-Name"] a + a { color: #536471; }
      article p { margin: 2px 0 6px; }
      article button { margin-right: 8px; }
      [role="dialog"] { width: 600px; margin: 12px auto; }
      [data-testid="tweetTextarea_0"] { min-height: 40px; border: 1px solid #cfd9de; border-radius: 8px; padding: 8px; }
      .hc { position: absolute; width: 260px; padding: 14px; border-radius: 14px; background: inherit; box-shadow: 0 0 12px rgba(101,119,134,.3); background: #fff; color: #0f1419; }
      body.dark .hc { background: #000; color: #e7e9ea; box-shadow: 0 0 12px rgba(255,255,255,.2); }
      [data-testid$="-follow"], [data-testid$="-unfollow"] { padding: 6px 16px; border-radius: 999px; border: 0; font-weight: 700; background: #0f1419; color: #fff; }
    </style>
  </head>
  <body>
    <nav><a data-testid="AppTabBar_Profile_Link" href="/me_test"></a></nav>
    <!-- Minimal copy of the X DOM attributes Xhandy relies on. Times are filled in by the script below. -->
    <main>
      <article data-testid="tweet" id="fresh" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-alice"><a href="/alice" class="av">A</a></div></div>
        <div data-testid="User-Name">
          <a href="/alice">Alice</a>
          <a href="/alice/status/111"><time id="t-fresh"></time></a>
        </div>
        <p>fresh post</p>
        <button data-testid="reply">reply</button>
        <button data-testid="like">like</button>
      </article>
      <article data-testid="tweet" id="old" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-bob"><a href="/bob" class="av">B</a></div></div>
        <div data-testid="User-Name">
          <a href="/bob">Bob</a>
          <a href="/bob/status/222"><time id="t-old"></time></a>
        </div>
        <p>old post</p>
        <button data-testid="reply">reply</button>
        <button data-testid="like">like</button>
      </article>
      <article data-testid="tweet" id="dan" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-dan"><a href="/dan" class="av">D</a></div></div>
        <div data-testid="User-Name">
          <a href="/dan">Dan</a>
          <a href="/dan/status/555"><time id="t-dan"></time></a>
        </div>
        <p>dan post</p>
      </article>
      <article data-testid="tweet" id="eve" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-eve"><a href="/eve" class="av">E</a></div></div>
        <div data-testid="User-Name">
          <a href="/eve">Eve</a>
          <a href="/eve/status/666"><time id="t-eve"></time></a>
        </div>
        <p>eve post (no hover card)</p>
      </article>
      <article data-testid="tweet" id="carol">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-carol"><a href="/carol" class="av">C</a></div></div>
        <div data-testid="User-Name">
          <a href="/carol">Carol</a>
          <a href="/carol/status/444"><time id="t-carol"></time></a>
        </div>
        <button type="button" data-testid="caret" aria-label="More">⋯</button>
        <p>carol post</p>
      </article>
      <article data-testid="tweet" id="mine" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-me_test"><a href="/me_test" class="av">M</a></div></div>
        <div data-testid="User-Name">
          <a href="/me_test">Me</a>
          <a href="/me_test/status/777"><time id="t-mine"></time></a>
        </div>
        <button type="button" data-testid="like">♡</button>
        <p>my own post</p>
      </article>
    </main>
    <div role="dialog" id="composer">
      <div data-testid="tweetTextarea_0_label">
        <div data-testid="tweetTextarea_0RichTextInputContainer">
          <div data-testid="tweetTextarea_0" contenteditable="true" role="textbox"></div>
        </div>
      </div>
      <button data-testid="tweetButton">Reply</button>
    </div>
    <script>
      // For the e2e: count mouse/pointer events not made by a real input device. Kept in
      // sessionStorage so the count survives Shift+F's navigation to a profile.
      for (const type of ["pointerover", "pointerenter", "mouseover", "mouseenter", "pointerout", "pointerleave", "mouseout", "mouseleave"]) {
        document.addEventListener(type, (e) => e.isTrusted || (sessionStorage.syntheticPointer = (+sessionStorage.syntheticPointer || 0) + 1), true);
      }
      // Like X: following sends POST .../friendships/create.json, answered with the account.
      const xhFriendship = (kind, handle, id) =>
        fetch("/i/api/1.1/friendships/" + kind + ".json", { method: "POST", body: new URLSearchParams({ screen_name: handle, user_id: id }) });
      // Like X: a post's ⋯ menu has "Follow @handle" as a plain menu item, not a Follow button.
      document.addEventListener("click", (e) => {
        if (e.target.closest('[data-testid="caret"]')) {
          const menu = document.createElement("div");
          menu.setAttribute("role", "menu");
          menu.innerHTML = '<div role="menuitem" id="mi-follow"><span>Follow @carol</span></div><div role="menuitem" id="mi-mute"><span>Mute @carol</span></div>';
          menu.querySelector("#mi-follow").addEventListener("click", () => (xhFriendship("create", "carol", "3"), menu.remove()));
          menu.querySelector("#mi-mute").addEventListener("click", () => menu.remove());
          document.body.appendChild(menu);
        }
      });
      // Like X: timeline data arrives via fetch and XHR, before the content script has loaded.
      fetch("/i/api/graphql/abc/HomeTimeline").then((r) => r.json());
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "/i/api/graphql/def/UserTweets");
      xhr.send();
      document.getElementById("t-dan").setAttribute("datetime", new Date(Date.now() - 1800e3).toISOString());
      document.getElementById("t-eve").setAttribute("datetime", new Date(Date.now() - 900e3).toISOString());
      document.getElementById("t-mine").setAttribute("datetime", new Date(Date.now() - 3600e3).toISOString());
      // Like X: hovering an avatar opens a hover card (no data-testid on the card itself) with the
      // author's Follow button: data-testid "<id>-follow" and aria-label "Follow @handle".
      // eve has no hover card, to exercise the profile fallback.
      const ids = { alice: "1", bob: "2", carol: "3", dan: "8" };
      document.addEventListener("mouseover", (e) => {
        const box = e.target.closest('[data-testid^="UserAvatar-Container-"]');
        if (!box || document.querySelector(".hc")) return;
        const h = box.dataset.testid.replace("UserAvatar-Container-", "");
        if (!ids[h]) return;
        setTimeout(() => {
          const card = document.createElement("div");
          card.className = "hc";
          const r = box.getBoundingClientRect();
          card.style.left = r.left + "px";
          card.style.top = r.bottom + window.scrollY + 6 + "px";
          card.innerHTML = `<a href="/${h}"><b>@${h}</b></a><p>bio of ${h}</p><button type="button" data-testid="${ids[h]}-follow" aria-label="Follow @${h}">Follow</button>`;
          card.querySelector("button").addEventListener("click", (ev) => {
            xhFriendship("create", h, ids[h]);
            ev.target.dataset.testid = ids[h] + "-unfollow";
            ev.target.setAttribute("aria-label", "Following @" + h);
          });
          document.body.appendChild(card);
        }, 300);
      });
      document.addEventListener("mouseout", (e) => {
        if (e.target.closest('[data-testid^="UserAvatar-Container-"]')) document.querySelector(".hc")?.remove();
      });
      if (location.search.includes("theme=dark")) document.body.classList.add("dark");
      document.getElementById("t-carol").setAttribute("datetime", new Date(Date.now() - 600e3).toISOString());
      document.getElementById("t-fresh").setAttribute("datetime", new Date(Date.now() - 2 * 3600e3).toISOString());
      document.getElementById("t-old").setAttribute("datetime", new Date(Date.now() - 3 * 86400e3).toISOString());
      // Like X: "l" on a focused post toggles like <-> unlike.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "l" || e.target.closest("[contenteditable]")) return;
        const btn = document.activeElement.closest("article")?.querySelector('[data-testid="like"],[data-testid="unlike"]');
        if (btn) btn.dataset.testid = btn.dataset.testid === "like" ? "unlike" : "like";
      });
      let currentReplyTo = "alice";
      document.addEventListener("click", (e) => {
        const article = e.target.closest("article");
        if (article) {
          const h = article.querySelector('[data-testid="User-Name"] a')?.getAttribute("href")?.slice(1);
          if (h) currentReplyTo = h;
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "r") {
          const article = document.activeElement?.closest("article");
          if (article) {
            const h = article.querySelector('[data-testid="User-Name"] a')?.getAttribute("href")?.slice(1);
            if (h) currentReplyTo = h;
          }
        }
      });

      // Like X: the send button makes a CreateTweet mutation, then clears the composer.
      // Done synchronously because headless Chromium throttles timers, which made a delayed
      // clear wipe the next test input.
      document.querySelector('[data-testid="tweetButton"]').addEventListener("click", () => {
        const box = document.querySelector('[data-testid="tweetTextarea_0"]');
        const text = box ? box.textContent : "";
        if (!window.__noCreateTweet) {
          fetch("https://x.com/i/api/graphql/abc/CreateTweet", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text, to: currentReplyTo }),
          });
        }
        if (box) box.textContent = "";
      });
    </script>
  </body>
</html>
