<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fake status page</title>
    <style>
      body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, "Noto Sans CJK SC", sans-serif; background: #fff; color: #0f1419; }
      body.dark { background: #000; color: #e7e9ea; }
      main { width: 600px; margin: 0 auto; border-left: 1px solid #eff3f4; border-right: 1px solid #eff3f4; min-height: 100vh; }
      body.dark main { border-color: #2f3336; }
      article, [data-e2e-post] { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eff3f4; }
      body.dark :is(article, [data-e2e-post]) { border-color: #2f3336; }
      :is(article, [data-e2e-post]):focus { outline: none; background: rgba(127,127,127,.06); }
      :is(article, [data-e2e-post]) > *:not(:is([data-testid="Tweet-User-Avatar"], [data-e2e="Tweet-User-Avatar"])) { grid-column: 2; }
      :is([data-testid="Tweet-User-Avatar"], [data-e2e="Tweet-User-Avatar"]) { grid-row: 1 / span 4; }
      .av { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #1d9bf0; color: #fff; text-decoration: none; font-weight: 700; }
      :is([data-testid="User-Name"], [data-e2e="User-Name"]) { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
      :is([data-testid="User-Name"], [data-e2e="User-Name"]) a { color: inherit; text-decoration: none; }
      :is([data-testid="User-Name"], [data-e2e="User-Name"]) a:first-child { font-weight: 700; }
      :is([data-testid="User-Name"], [data-e2e="User-Name"]) a + a { color: #536471; }
      :is(article, [data-e2e-post]) p { margin: 2px 0 6px; }
      :is(article, [data-e2e-post]) button { margin-right: 8px; }
    </style>
  </head>
  <body>
    <script>
      // For the e2e's layout variants (XH_LAYOUT in test/e2e.mjs): a post may be an article or a div[data-e2e-post],
      // and an in-post data-testid may have moved to data-e2e. These find them either way.
      window.E2E = {
        post: "article, [data-e2e-post]",
        q: (id) => `:is([data-testid="${id}"], [data-e2e="${id}"])`,
        id: (el) => el && (el.getAttribute("data-testid") || el.getAttribute("data-e2e")),
        set: (el, id) => el.setAttribute(el.hasAttribute("data-testid") ? "data-testid" : "data-e2e", id),
      };
    </script>
    <nav><a data-testid="AppTabBar_Profile_Link" href="/me_test"></a></nav>
    <main>
      <article data-testid="tweet" id="focal" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-alice"><a href="/alice" class="av">A</a></div></div>
        <div data-testid="User-Name">
          <a href="/alice">Alice</a>
          <a href="/alice/status/111"><time id="t-focal"></time></a>
        </div>
        <div data-testid="tweetText" lang="en" dir="auto">focal post text</div>
        <button data-testid="reply">reply</button>
        <button data-testid="like">like</button>
      </article>
      <article data-testid="tweet" id="reply" tabindex="0">
        <div data-testid="Tweet-User-Avatar"><div data-testid="UserAvatar-Container-bob"><a href="/bob" class="av">B</a></div></div>
        <div data-testid="User-Name">
          <a href="/bob">Bob</a>
          <a href="/bob/status/222"><time id="t-reply"></time></a>
        </div>
        <div data-testid="tweetText" lang="en" dir="auto">reply post text</div>
        <button data-testid="reply">reply</button>
        <button data-testid="like">like</button>
      </article>
    </main>
    <script>
      fetch("/i/api/graphql/abc/HomeTimeline").then((r) => r.json());
      document.getElementById("t-focal").setAttribute("datetime", new Date(Date.now() - 2 * 3600e3).toISOString());
      document.getElementById("t-reply").setAttribute("datetime", new Date(Date.now() - 3600e3).toISOString());
    </script>
  </body>
</html>
