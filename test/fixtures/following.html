<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>fake following page</title>
    <style>body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #fff; } main { width: 600px; margin: 0 auto; }
      [data-testid="UserCell"] { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #eff3f4; }
      [data-testid$="-follow"], [data-testid$="-unfollow"] { padding: 6px 16px; border-radius: 999px; border: 0; font-weight: 700; background: #0f1419; color: #fff; }</style>
  </head>
  <body>
    <nav><a data-testid="AppTabBar_Profile_Link" href="/me_test">Profile</a></nav>
    <main>
      <div data-testid="UserCell" id="zed"><span>Zed @zed</span><button type="button" data-testid="20-unfollow" aria-label="Following @zed">Following</button></div>
      <div data-testid="UserCell" id="mia"><span>Mia @mia</span><button type="button" data-testid="21-unfollow" aria-label="Following @mia">Following</button></div>
      <div data-testid="UserCell" id="ann"><span>Ann Lee @ann</span><button type="button" data-testid="22-unfollow" aria-label="Following @ann">Following</button></div>
    </main>
    <script>
      // Like X: the list arrives via the Following GraphQL call; Following → Unfollow asks to confirm.
      fetch("/i/api/graphql/ghi/Following").then((r) => r.json());
      document.addEventListener("click", (e) => {
        const btn = e.target.closest('[data-testid$="-unfollow"]');
        if (btn) {
          const sheet = document.createElement("div");
          sheet.setAttribute("role", "dialog");
          sheet.innerHTML = '<button type="button" data-testid="confirmationSheetConfirm">Unfollow</button>';
          sheet.firstChild.addEventListener("click", () => {
            // Like X: the unfollow is POST .../friendships/destroy.json, answered with the account.
            const handle = btn.getAttribute("aria-label").split("@")[1];
            fetch("/i/api/1.1/friendships/destroy.json", { method: "POST", body: new URLSearchParams({ screen_name: handle, user_id: btn.dataset.testid.split("-")[0] }) });
            btn.dataset.testid = btn.dataset.testid.replace("-unfollow", "-follow");
            btn.textContent = "Follow";
            sheet.remove();
          });
          document.body.appendChild(sheet);
        }
      });
    </script>
  </body>
</html>
