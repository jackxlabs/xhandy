  boilerplate:               # press "about" paragraphs; 50 / 100 / 250 words (zh about 2 字 per word)
    "50":
      zh: "Xhandy 是给手动玩 X 的人用的浏览器插件，开源免费。它把帖子热度、你和作者的关注关系、互动记录标在每条帖子旁边，一眼看出该回哪条。它从不替你操作，数据只在你的浏览器里。"
      en: "Xhandy is a free, open-source browser extension for people who engage on X by hand. Next to every post it shows post heat, follow status and interaction history, so you can see which posts are worth a reply. It never acts for you and keeps all data in your browser."
    "100":
      zh: "Xhandy 是给手动玩 X 的创作者用的浏览器插件。刷 X 时，它把帖子发了多久、每小时多少浏览、你和作者是否互关、互动过几次，直接标在每条帖子旁边，一眼看出该回哪条；打字时还会提醒你别发重复回复。它从不替你点击或发送，数据只存在你的浏览器里，开源免费。Xhandy 支持 Chrome、Edge 和 Brave，当前版本 v0.4.7 可从 GitHub 发布页下载。Xhandy 是独立项目，与 X Corp. 没有任何关联，也未获其认可或赞助。"
      en: "Xhandy is a browser extension for people who engage on X by hand. Next to every post it shows how old the post is and how fast it is getting views, whether you and the author follow each other, and how often you have interacted. It warns you before you send a near-duplicate reply. It never clicks or sends anything for you, keeps all data in your browser, and is free and open source. Xhandy runs on Chrome, Edge and Brave; version 0.4.7 is on GitHub Releases. Xhandy is an independent project. It is not affiliated with, endorsed by or sponsored by X Corp."
    "250":
      zh: |-
        Xhandy 是给手动玩 X 的创作者用的浏览器插件，支持 Chrome、Edge 和 Brave。靠手动回复起号的人，最难的是判断哪条帖子值得回、和作者是什么关系。Xhandy 把答案标在每条帖子旁边：发了多久和每小时浏览量（每小时 1000 以上标橙，1 万以上标红，超过 48 小时变灰），你和作者是否互关，互动过几次、最近一次是什么时候。

        写回复时，如果和最近发过的很像，Xhandy 会提醒你；页面底部统计今天的点赞、回复、发帖和在线时长；「没回关我」列表只读，没有取关按钮；关注和取关超过每日软上限会提醒。

        Xhandy 从不替你操作：不点击、不输入、不发送、不点赞、不关注。它只申请「存储」和「无限存储」两个权限，不联网、不做统计、不加载远程代码，数据只在你的浏览器里。界面跟随浏览器语言显示中文或英文。

        Xhandy 开源免费，当前版本 v0.4.7，在 github.com/jackxlabs/xhandy 下载。Xhandy 是独立项目，与 X Corp. 没有任何关联，也未获其认可或赞助。
      en: |-
        Xhandy is a browser extension for people who engage on X by hand, available for Chrome, Edge and Brave. For anyone growing an account through replies, the hard part is knowing which posts deserve one and where you stand with the author. Xhandy puts the answers next to every post: how old it is and how many views it is getting per hour (orange from 1,000 an hour, red from 10,000, grey after 48 hours), whether you and the author follow each other, and how often you have interacted and when you last did.

        While you type, Xhandy warns you if a reply is very similar to one you sent recently. A small bar tracks today's likes, replies, posts and time on X. A read-only "not following you back" panel has no unfollow button, and soft daily limits remind you before you follow or unfollow too fast.

        Xhandy never acts for you: it does not click, type, send, like or follow. It has two permissions, storage and unlimitedStorage, makes no network requests, runs no analytics and loads no remote code, so all data stays in your browser. The interface follows your browser language, in Chinese or English.

        Xhandy is free and open source. Version 0.4.7 is available at github.com/jackxlabs/xhandy. Xhandy is an independent project. It is not affiliated with, endorsed by or sponsored by X Corp.
