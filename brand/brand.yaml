# Xhandy brand kit source. Edit through conversation (brand-kit skill), then run compile.py. brand/build/ is generated.
# Text fields are written per language: { zh: "...", en: "..." }. English is written natively, not translated line by line.

meta:
  name: Xhandy
  slug: xhandy
  version: 9
  updated: "2026-10-20"
  parent: null
  languages: [zh, en]
  owner: Jack
  website: "github.com/jackxlabs/xhandy"

identity:
  status: confirmed          # core approved by Jack 2026-10-19 (zh); English reviewed by Claude, approved per Jack 2026-10-20
  one_liner:                 # Jack picked the short line 2026-10-19
    short:
      zh: "刷 X 时的顺手提示"
      en: "Quiet hints while you use X"
    medium:
      zh: "Xhandy 是刷 X 时的顺手提示：帖子热度、你们的关系和互动记录标在每条帖子旁边，一眼看出该回哪条。"
      en: "Xhandy puts post heat, your relationship with the author and your interaction history next to every post, so you can see which ones are worth a reply."
    long:
      zh: "Xhandy 是给手动玩 X 的创作者用的浏览器插件。刷 X 时，它把帖子发了多久、每小时多少浏览、你和作者是否互关、互动过几次，直接标在每条帖子旁边，一眼看出该回哪条；打字时还会提醒你别发重复回复。它从不替你点击或发送，数据只存在你的浏览器里，开源免费。"
      en: "Xhandy is a browser extension for people who engage on X by hand. Next to every post it shows how old the post is and how fast it is getting views, whether you and the author follow each other, and how often you have interacted. It warns you before you send a near-duplicate reply. It never clicks or sends anything for you, keeps all data in your browser, and is free and open source."
  category:
    stated:
      zh: "X 浏览器插件：给手动玩 X 的人用的提示工具"
      en: "A browser extension for X: hints for people who engage by hand"
    actual:
      zh: "纯手动刷 + 靠脑子记；想知道关系只能点进主页或悬浮在头像上看；或者用其他 X 浏览器插件"
      en: "Scrolling by hand and remembering who is who; opening profiles or hovering over avatars to check follow status; or other X browser extensions"
    opportunity: ""
  positioning:               # Jack picked A1 after the competitor check, 2026-10-19
    zh: "给靠手动互动起号的中文创作者：Xhandy 把帖子热度、你们的关系和互动记录一起标在每条帖子旁边，一眼看出该回哪条。别的插件各管一项，Xhandy 一个全有，而且从不替你操作。"
    en: "For people who grow on X by replying and engaging by hand: Xhandy shows post heat, your relationship with the author and your interaction history right next to every post, so you can see which ones are worth a reply. Other extensions each cover one of these; Xhandy covers them all, and never acts for you."
  audience:
    - id: zh-creators
      who:
        zh: "简中蓝 V 创作者：靠手动互动起号、在意浏览和收益的中文 X 用户（主要受众）"
        en: "Simplified-Chinese creators with X Premium who grow by engaging by hand and care about views and payouts (primary audience)"
      problem:
        zh: "不知道哪条帖子值得回；和谁互关、互动过几次只能点进主页或悬浮在头像上看，不直观"
        en: "They can't tell which posts are worth replying to, and checking who follows them back or how often they've talked means opening profiles or hovering over avatars"
      lexicon: []            # todo: collect their own words from real posts and replies
      where: [X]
      source: jack-2026-10-19
    - id: en-engagers
      who:
        zh: "手动互动的英文 X 用户（第二受众）"
        en: "English-speaking X users who engage by hand (secondary audience)"
      problem:
        zh: "同上：不知道该回哪条，关系和互动记录要一个个点开才能看到"
        en: "The same: no quick way to see which posts deserve a reply, and follow status and past interactions are hidden behind clicks"
      lexicon: []
      where: [X, GitHub]
      source: jack-2026-10-19
  not_for:                    # Jack 2026-10-19
    - zh: "想全自动涨粉的人：要自动关注、自动回复、挂机互动的"
      en: "People who want growth on autopilot: auto-follow, auto-reply, engagement bots"
  refuses_to_be:              # confirmed by Jack 2026-10-19
    - zh: "替用户操作的工具：不点击、不输入、不发送、不点赞、不关注、不取关，也不做批量动作"
      en: "A tool that acts for you: it never clicks, types, sends, likes, follows or unfollows, and does nothing in bulk"
    - zh: "收集数据的工具：默认不联网、不做统计、不加载远程代码，数据只在用户浏览器里"
      en: "A data collector: no network requests, no analytics, no remote code; your data stays in your browser"
    - zh: "让账号看起来像机器人的加速器：关注、取关有软上限提醒，重复回复会提醒"
      en: "A speed tool that makes accounts look like bots: soft daily limits on follows and unfollows, and warnings on repeated replies"
  personality:                # Jack picked 3 of 4, 2026-10-19
    - trait: { zh: "直白", en: "Plain" }
      is:
        zh: "标签一眼看懂，例如「2小时 · 1.5万/时」"
        en: "Labels you read at a glance, like \"2h · 15K/h\""
      is_not: { zh: "花哨的数据大屏", en: "a flashy analytics dashboard" }
    - trait: { zh: "懂行", en: "Savvy" }
      is:
        zh: "懂 X 的玩法：超过 48 小时变灰、重复回复会被当成垃圾"
        en: "Knows how X works: posts over 48 hours old go grey, repeated replies look like spam"
      is_not: { zh: "爱说教", en: "preachy" }
    - trait: { zh: "顺手", en: "Handy" }
      is:
        zh: "不打扰、快捷键直达、浮层不挡点击"
        en: "Stays out of the way: keyboard shortcuts, overlays that never block a click"
      is_not: { zh: "功能堆砌", en: "feature bloat" }
  products:
    - name: Xhandy
      what:
        zh: "Chromium 浏览器扩展（Chrome、Edge、Brave），在 X 上显示帖子时效和每小时浏览量、关注关系、互动记忆、重复回复提醒、每日统计；关注助手和「没回关我」面板"
        en: "A Chromium extension (Chrome, Edge, Brave) that adds post age and views per hour, follow status, interaction history, duplicate-reply warnings and daily stats to X, plus a follow assistant and a \"not following you back\" panel"
      status: { zh: "已上线，v0.4.7，从 GitHub 发布页下载", en: "Live, v0.4.7, download from GitHub Releases" }
    - name: "v0.5"
      what:
        zh: "路线图：互动队列、灵感清单、引用草稿预填、导出和推送到自定义地址"
        en: "Roadmap: interaction queue, local idea list, draft prefill for quote posts, export and a generic webhook"
      status: planned
    - name: "v0.6"
      what:
        zh: "路线图：可选的 Notion 同步、上架商店"
        en: "Roadmap: optional Notion sync, store listing"
      status: planned
  naming:
    - zh: "对外名称 Xhandy（X 大写，其余小写），不写 XHandy、X-handy、X Handy"
      en: "Always \"Xhandy\": capital X, the rest lower case. Never XHandy, X-handy or X Handy"
    - zh: "中文文案里也写 Xhandy，不起中文名"
      en: "Chinese copy uses the Latin name Xhandy too; there is no Chinese name"
    - zh: "仓库和本地文件夹叫 x-helper，只在开发场景出现，对外不用"
      en: "The repository and local folder are called x-helper; that name is for development only"
  proof_points:
    - claim: { zh: "从不替你操作", en: "Never acts for you" }
      evidence:
        zh: "不点击、不输入、不发送、不点赞、不关注；关注助手只把焦点放到 X 自己的关注按钮上，按 Enter 的是用户。端到端测试里的「插件从不自行点击」和「从不伪造鼠标或指针事件」两项保证这一点"
        en: "It never clicks, types, sends, likes or follows. The follow assistant only moves focus to X's own Follow button; you press Enter. End-to-end tests (\"extension never clicks anything by itself\", \"never fakes mouse or pointer events\") enforce it"
      source: readme
    - claim: { zh: "不联网，数据只在你的浏览器里", en: "No network, your data stays in your browser" }
      evidence:
        zh: "只申请「存储」和「无限存储」两个权限；没有网络请求、统计或远程代码；可导出、导入、清空"
        en: "Only two permissions, storage and unlimitedStorage; no network requests, analytics or remote code; export, import or delete everything"
      source: readme
    - claim: { zh: "一眼看出哪条帖子正火", en: "See which posts are taking off" }
      evidence:
        zh: "每小时浏览 1000 以上标橙，1 万以上标红带 🔥；超过 48 小时的帖子变灰"
        en: "Orange from 1,000 views an hour, red with 🔥 from 10,000; posts older than 48 hours go grey"
      source: readme
    - claim: { zh: "记得你和每个作者的关系", en: "Remembers where you stand with every author" }
      evidence:
        zh: "显示互关状态（⇄ 互关 / → 我关注他 / ← 他关注我 / 未关注）和互动次数、最近一次时间"
        en: "Shows follow status (⇄ mutual / → you follow / ← follows you / not following), how often you have interacted and when you last did"
      source: readme
    - claim: { zh: "一个插件全有", en: "All of it in one extension" }
      evidence:
        zh: "热度和时效标记、关注关系、互动次数和最近一次时间、重复回复提醒、每日统计、关注助手、没回关我面板，都在同一个插件里"
        en: "Post age and heat, follow status, interaction history, duplicate-reply warnings, daily stats, the follow assistant and the \"not following you back\" panel"
      source: readme
    - claim: { zh: "开源，免费", en: "Free and open source" }
      evidence:
        zh: "公开仓库 jackxlabs/xhandy，从 GitHub 发布页下载"
        en: "Public repository jackxlabs/xhandy; download from GitHub Releases"
      source: readme
    - claim: { zh: "中英文界面", en: "Chinese and English interface" }
      evidence:
        zh: "浏览器语言是中文时显示中文，否则英文"
        en: "Chinese when the browser language is Chinese, English otherwise"
      source: readme

competitors:               # confirmed list by Jack 2026-10-19; user numbers not checked (store pages block scraping)
  - name: { zh: "X互关雷达", en: "X Mutual Radar (Chinese store listing)" }
    url: https://chromewebstore.google.com/detail/x-mutual-radar/gheaelnpnfiakildlchjkomnbfccddep
    positioning:
      zh: "在 x.com 页面标记互关和单向关注关系，并可选择显示关注数和粉丝数之比（据商店描述）"
      en: "Marks mutual and one-way follows on x.com, with an optional following/followers ratio (from its store description, translated)"
    owns: ["互关雷达", "关注率", "mutual radar"]
    our_difference:
      zh: "Xhandy 在同一个标签里还给出互动次数和最近一次时间，并配热度标记"
      en: "Xhandy adds interaction count and last contact to the same label, next to post heat"
    avoid: ["雷达", "radar"]
    visual: { colors: [], logo_notes: "" }
    source: web-2026-10-19
    checked: "2026-10-19"
  - name: { zh: "X 爆款监测", en: "X Viral Monitor (Chinese store listing)" }
    url: https://chromewebstore.google.com/detail/x-viral-monitor/dkplofpecmjmbhgjgleeflcnfgfkdfpd
    positioning:
      zh: "X 推文流速徽章、长图阅读、Markdown 复制、转发星图、Grok 回复辅助，全部本地处理，零数据收集（商店描述原文）"
      en: "Views-per-hour badges, long-image reading, Markdown copy, repost maps and Grok reply help, all processed locally with zero data collection (from its store description, translated)"
    owns: ["爆款", "流速徽章", "零数据收集", "viral", "zero data collection"]
    our_difference:
      zh: "Xhandy 的热度标记和关系、互动记录在同一个标签里；不做 AI 回复辅助，回复全由你自己写"
      en: "Xhandy keeps heat, relationship and interaction history in one label, and has no AI reply help: you write every reply yourself"
    avoid: ["爆款监测", "流速", "viral monitor"]
    visual: { colors: [], logo_notes: "" }
    source: web-2026-10-19
    checked: "2026-10-19"
  - name:
      zh: "互关检测 / 粉丝数类小插件（X(Twitter) 互关检测助手、X Following Tracker、Follower Lens、x-follower-count）"
      en: "Mutual-check and follower-count add-ons (a Chinese X mutual checker, X Following Tracker, Follower Lens, x-follower-count)"
    url: https://github.com/yaohongan/x-follower-lens
    positioning:
      zh: "单项工具：识别互关、导出关注列表、在用户名旁显示粉丝数"
      en: "Single-purpose tools: detect mutuals, export your following list, show follower counts next to names"
    owns: ["互关检测", "mutual checker"]
    our_difference:
      zh: "Xhandy 的「没回关我」面板只读、不提供取关按钮，并把关系放进时间线标签"
      en: "Xhandy's \"not following you back\" panel is read-only with no unfollow button, and follow status lives in the timeline label"
    avoid: []
    source: web-2026-10-19
    checked: "2026-10-19"
  - name: "tendX / SuperX / BlackMagic"
    status: draft            # from third-party round-ups, not checked on their own sites
    url: https://www.tendx.app/
    positioning:
      zh: "英文工具：记录你发出的点赞、回复、私信，或在主页上叠加双方互动数据；SuperX、BlackMagic 为付费"
      en: "English-language tools that log the likes, replies and DMs you send, or overlay interaction data on profiles; SuperX and BlackMagic are paid"
    owns: ["interaction history", "engagement CRM"]
    our_difference:
      zh: "Xhandy 免费开源、不联网，把互动记录直接标在时间线上"
      en: "Xhandy is free, open source and offline, and puts interaction history straight on the timeline"
    avoid: []
    source: web-2026-10-19
    checked: "2026-10-19"
  - name: AutoFollowers
    url: https://chromewebstore.google.com/detail/autofollowers/cioeeikbgpoepcgfmpfaajgkaommkbni
    positioning:
      zh: "Twitter/X 批量取关与关注，按认证状态、粉丝区间、互关状态筛选"
      en: "Bulk follow and unfollow for X, filtered by verification, follower range and mutual status"
    owns: ["批量关注", "批量取关", "bulk follow", "mass unfollow"]
    our_difference:
      zh: "反面对照：Xhandy 从不批量、从不替你操作"
      en: "The opposite of Xhandy, which never works in bulk and never acts for you"
    avoid: ["批量", "一键", "bulk", "one-click"]
    source: web-2026-10-19
    checked: "2026-10-19"

voice:
  status: confirmed          # Jack 2026-10-19 (zh); English reviewed by Claude, approved per Jack 2026-10-20
  essence:
    zh: "Xhandy 说话像坐你旁边的朋友：话少，但每句都有用"
    en: "Xhandy talks like a friend sitting next to you: says little, and every line is useful"
  axes:
    formal_casual: { value: 3, note: { zh: "说明文的清楚，不端着也不玩梗", en: "Clear like good docs; neither stiff nor jokey" } }
    serious_playful: { value: 2, note: { zh: "认真为主，偶尔一句轻松话", en: "Mostly serious, with the occasional light line" } }
    plain_technical: { value: 2, note: { zh: "大白话，技术词换成用户看得懂的说法", en: "Plain words; technical terms swapped for what users would say" } }
    reserved_bold: { value: 2, note: { zh: "克制，不夸大效果，局限直接说", en: "Understated; no inflated claims, limits stated openly" } }
  traits:                    # one per personality trait; "before" is invented bad copy, "after" follows README style
    - trait: { zh: "直白", en: "Plain" }
      do: { zh: "先给结论和具体数字", en: "Lead with the result and a real number" }
      dont: { zh: "形容词堆砌、模糊的「提升」「优化」", en: "Stacked adjectives, vague \"boost\" or \"optimise\"" }
      before:
        zh: "Xhandy 智能分析帖子热度，助你精准把握流量密码！"
        en: "Xhandy's smart engine analyses post performance to supercharge your growth!"
      after:
        zh: "每小时 1 万浏览以上的帖子标红，一眼看出哪条正火。"
        en: "Posts getting over 10,000 views an hour turn red, so you can see what's taking off."
    - trait: { zh: "懂行", en: "Savvy" }
      do: { zh: "用半句话讲清 X 上为什么要这样", en: "Give the X-specific reason in half a sentence" }
      dont: { zh: "说教，或者列一长串注意事项", en: "Lecturing, or long lists of warnings" }
      before:
        zh: "为了您的账号安全，请务必注意不要频繁关注他人。"
        en: "For your account's safety, please be careful not to follow too many people too frequently."
      after:
        zh: "每天关注超过 20 个会提醒你：关注太快容易被限流。"
        en: "Xhandy reminds you after 20 follows a day: following fast can get an account limited."
    - trait: { zh: "顺手", en: "Handy" }
      do: { zh: "直接说按哪个键、在哪里找", en: "Say which key to press and where to look" }
      dont: { zh: "大段功能介绍", en: "Long feature tours" }
      before:
        zh: "您可以通过使用我们精心设计的快捷键功能来大幅提升效率。"
        en: "Take advantage of our thoughtfully designed keyboard shortcuts to dramatically boost your productivity."
      after:
        zh: "选中帖子按 Shift+F，焦点会跳到作者的关注按钮上。"
        en: "Select a post and press Shift+F: focus jumps to the author's Follow button."
  vocabulary:
    # English words allowed inside Chinese copy (proper nouns only), checked by brand-kit langmix.py; Jack 2026-10-20:
    # Chinese copy carries no other English, English copy carries no Chinese
    keep_latin: [Jack, Corp, SuperX, BlackMagic, AutoFollowers, Following, Tracker, Follower, Lens, Handy, X-handy, handy]
    use:
      - { lang: zh, use: "帖子", not: "推文、推特", reason: "README 和界面统一用帖子；平台已改名 X", source: readme }
      - { lang: en, use: "post", not: "tweet", reason: "X's own term since 2023; the README and UI use post", source: readme }
      - { use: "X", not: { zh: "推特、Twitter", en: "Twitter" }, reason: { zh: "平台现名", en: "The platform's current name" }, source: readme }
      - { lang: zh, use: "互关、回关", not: "互粉、回粉", reason: "README 和界面用词", source: readme }
      - { lang: en, use: "mutual, follows you back", not: "follow-back, F4F", reason: "UI wording; F4F reads as follow-for-follow schemes", source: readme }
      - { lang: zh, use: "关注、取关", not: "加关注、取消关注（界面里可以用全称）", reason: "README 用词，简短", source: readme }
      - { use: { zh: "提醒", en: "reminder, warning" }, not: { zh: "拦截、禁止、限制", en: "block, prevent, stop" }, reason: { zh: "软上限只提醒不拦截，用错词会让人以为插件会阻止操作", en: "Soft limits only remind; the wrong word suggests Xhandy stops you" }, source: dev-rules }
      - { use: { zh: "浏览量", en: "views" }, not: { zh: "曝光量、流量", en: "impressions, reach" }, reason: { zh: "标签显示的就是 X 的浏览数", en: "The label shows X's own view count" }, source: readme }
    never_say:
      - { lang: zh, word: "保证不封号、绝对安全", reason: "太绝对，做不到保证；只能说不替你操作、有软上限提醒", source: jack-2026-10-19 }
      - { lang: en, word: "ban-proof, guaranteed safe, 100% safe", reason: "Too absolute and not something Xhandy can promise; say it never acts for you and has soft limits", source: jack-2026-10-19 }
      - { lang: zh, word: "智能、AI 分析", reason: "Xhandy 没有 AI 功能，所有标记都是规则和 X 自己的数据", source: readme }
      - { lang: en, word: "AI-powered, smart engine, intelligent", reason: "Xhandy has no AI; every label comes from rules and X's own data", source: readme }
      - { lang: zh, word: "流量密码、黑科技、神器、赋能", reason: "空洞的营销腔，和直白的个性冲突", source: jack-2026-10-19 }
      - { lang: en, word: "growth hack, game-changer, supercharge, 10x, unlock", reason: "Empty hype that clashes with being plain", source: jack-2026-10-19 }
      - { lang: zh, word: "您", reason: "README 和界面都用「你」", source: readme }
    jargon_policy:
      zh: "技术词（`Manifest V3`、`service worker`、`data-testid`）只出现在开发文档；面向用户时换成「浏览器插件」「X 改了页面」这类说法"
      en: "Technical terms (Manifest V3, service worker, data-testid) belong in developer docs; for users say \"browser extension\" or \"X changed its page\""
  style:
    numbers:
      zh: "用阿拉伯数字和真实阈值（1000/时、20 个、48 小时），不写「大量」「很多」"
      en: "Real numbers and thresholds (1,000/h, 20 a day, 48 hours), never \"tons\" or \"lots\"; thousands separators in prose, 15K style in labels"
    spacing_and_case:
      zh: "产品文档（README、发版说明、商店页）中英文、数字之间空一格；Jack 个人 X 帖子按他的 x-voice-guide 紧挨着写"
      en: "Sentence case for headings, buttons and titles; product and feature names as written in the UI"
    punctuation:
      zh: "不用感叹号；界面名、按钮名用「」"
      en: "No exclamation marks; UI names in quotes or bold, not both; Oxford comma optional, keep each document consistent"
    emoji:
      zh: "产品文案不用表情符号；界面标签里只有 🔥（热帖）和 ⇄ → ←（关系）"
      en: "No emoji in product copy; the UI only uses 🔥 for hot posts and ⇄ → ← for follow status"
    emphasis:
      zh: "加粗只用于警告和关键操作，例如「把它放在一个以后不会动的位置」"
      en: "Bold only for warnings and key steps, e.g. \"keep the folder where it is\""
    person:
      zh: "称用户为「你」；Xhandy 用名字自称，不用「我们」"
      en: "Address the reader as \"you\"; Xhandy refers to itself by name, not \"we\"; contractions are fine"
    limits:
      zh: "能力有边界就直接说，例如「这份列表不完整」「X 可能改了数据，别信这份列表」"
      en: "State limits plainly, e.g. \"this list is partial\", \"X may have changed its data, so don't trust this list\""
    spelling:
      zh: "中文用简体；产品名、快捷键、X 的界面词保留英文"
      en: "US or UK spelling, one per document (the README leans UK: 'colours', 'greyed out'; keep UK unless Jack prefers US); keyboard keys as Shift+F, Alt+U"
  ai_ism_patterns:
    - { lang: zh, pattern: "「不是 A，而是 B」「不只是 A，更是 B」这类对比否定", example: "Xhandy 不是工具，而是你的互动伙伴", fix: "直接说它做什么" }
    - { lang: zh, pattern: "三段排比、对仗工整的句子", example: "更快、更准、更安全", fix: "挑一个，配一个数字" }
    - { lang: zh, pattern: "结尾升华或金句", example: "让每一次互动都有意义", fix: "停在最后一个事实上" }
    - { lang: zh, pattern: "书面连接词", example: "说白了、本质上、值得注意的是、总的来说", fix: "删掉" }
    - { lang: en, pattern: "\"It's not just X, it's Y\" and other contrastive framing", example: "Xhandy isn't just a tool, it's your engagement partner", fix: "Say what it does" }
    - { lang: en, pattern: "Hype verbs and filler adjectives", example: "unlock, elevate, seamless, effortless, delve, game-changer", fix: "Use the plain verb and a number" }
    - { lang: en, pattern: "Scene-setting openers and rhetorical questions", example: "In today's fast-paced world of social media... Ever wondered why?", fix: "Start with the fact" }
    - { lang: en, pattern: "Triplets and em-dash chains", example: "Faster, smarter, safer — all in one place — for everyone", fix: "Keep one claim, add a number" }
    - { lang: en, pattern: "Inspirational closers", example: "Make every interaction count.", fix: "End on the last useful fact" }
  channels:
    readme:
      format: { zh: "说明体：先一句话说是什么，再按功能列，配截图；中英文各一份", en: "Docs style: one line on what it is, then features with screenshots; Chinese and English sections" }
      tone: { zh: "清楚、具体", en: "Clear and specific" }
    release_notes:
      format: { zh: "用 docs/release-template.md；本版更新一两句话，写用户能感知的变化", en: "Use docs/release-template.md; one or two sentences on changes users will notice" }
      tone: { zh: "平实", en: "Matter-of-fact" }
    store_listing:
      format: { zh: "第一行用短版一句话介绍，正文列功能，结尾附与 X Corp 无关的声明", en: "Short one-liner first, then the features, ending with the X Corp non-affiliation line" }
      length: { zh: "标题 ≤ 45 字符；简短描述 ≤ 132 字符", en: "Title up to 45 characters; short description up to 132" }
    ui:
      format: { zh: "一行以内，数字在前；出错时说可能的原因和下一步，不怪用户", en: "One line, numbers first; on errors say the likely cause and the next step, never blame the user" }
      tone: { zh: "提醒，不命令", en: "Remind, don't command" }
    x_post:
      format: { zh: "Jack 个人号提到 Xhandy 时，用他自己的经历讲，按 jack-personal-brand 的 x-voice-guide 写", en: "When Jack mentions Xhandy on his own account, it is his experience in his voice (jack-personal-brand x-voice-guide)" }
      tone: { zh: "Jack 的口吻", en: "Jack's voice" }

compliance:
  rules:
    - id: no-affiliation
      rule:
        zh: "说明与 X Corp 无关：不暗示是 X 官方产品或获其认可"
        en: "State that Xhandy is independent of X Corp; never suggest it is an official X product or endorsed by X"
      severity: hard
      applies_to: [store_listing, readme, release_notes, website]
      required_phrase:
        zh: "Xhandy 是独立项目，与 X Corp. 没有任何关联，也未获其认可或赞助。"
        en: "Xhandy is an independent project. It is not affiliated with, endorsed by or sponsored by X Corp."
      forbidden: ["X 官方", "X 认证", "official X", "by X", "X-approved"]
      reason:
        zh: "商标和商店审核；标志也刻意避开 X 官方标志的造型"
        en: "Trademark and store review; the logo also avoids the construction of X's logo"
      source: readme
      date: "2026-10-17"
    - id: no-automation-claims
      rule:
        zh: "不把 Xhandy 说成自动化或批量工具：不写自动关注、自动回复、一键批量、涨粉神器"
        en: "Never describe Xhandy as automation or a bulk tool: no auto-follow, auto-reply, one-click bulk actions or growth hacks"
      severity: hard
      applies_to: [all]
      forbidden: ["自动关注", "自动回复", "一键批量", "涨粉神器", "auto-follow", "auto-reply", "bulk", "on autopilot"]
      reason:
        zh: "产品规矩第 1 条：永远不替用户操作；这类说法也会招来 X 风控和商店审核问题"
        en: "Product rule 1: it never acts for the user; such claims also invite X enforcement and store review problems"
      source: dev-rules
      date: "2026-10-19"

