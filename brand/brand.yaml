# Messaging kit (messaging.py validates lengths and renders build/messaging/). Composed 2026-10-20 from the confirmed
# identity, proof points and README; every newly written line is status: draft until Jack approves it.
messaging:
  status: draft
  pitch:                     # spoken lengths: 10 s ≈ 30 words / 70 字, 30 s ≈ 75 words / 180 字, 2 min ≈ 300 words / 600 字
    10s:
      zh: "Xhandy 是刷 X 时的顺手提示：每条帖子旁边标出热度、你和作者的关系、互动过几次，一眼看出该回哪条。它从不替你操作。"
      en: "Xhandy is a browser extension that shows post heat, follow status and your interaction history next to every post on X, so you can see which ones are worth a reply."
    30s:
      zh: "Xhandy 是给手动玩 X 的人用的浏览器插件，开源免费。刷 X 时，它在每条帖子旁边标出发了多久、每小时多少浏览，你和作者是否互关、互动过几次，一眼看出该回哪条；打字时还会提醒你别发重复回复。它不点击、不发送、不关注，数据只存在你的浏览器里。"
      en: "Xhandy is a free, open-source browser extension for people who engage on X by hand. Next to every post it shows how old the post is and how fast it is getting views, whether you and the author follow each other, and how often you have interacted. It warns you before you send a near-duplicate reply. It never clicks or sends anything for you, and all data stays in your browser."
    2min:
      zh: |-
        靠手动回复起号的人，最费劲的是挑帖子：哪条正在火，一眼看不出来；和作者有没有互关、之前聊过几次，只能点进主页或者把鼠标移到头像上看。

        Xhandy 是一个浏览器插件，支持 Chrome、Edge 和 Brave，把这些信息直接标在每条帖子旁边。作者名旁的小标签写着发了多久和每小时浏览量，例如「2小时 · 1.5万/时」：每小时 1000 以上变橙，1 万以上变红，超过 48 小时的帖子变灰。旁边是你们的关注关系（⇄ 互关、→ 我关注他、← 他关注我）和互动记录，例如「互动3次 · 今天」。

        写回复时，如果和你最近发过的某条很像，Xhandy 会提醒你：重复的回复最容易被当成垃圾内容。页面底部的小条统计今天的点赞、回复、发帖、关注数和在线时长。按 Alt+U 打开「没回关我」列表，只能看，没有取关按钮；选中帖子按 Shift+F，焦点跳到作者的关注按钮上，按 Enter 的是你自己。

        Xhandy 不点击、不输入、不发送、不点赞、不关注。它只申请「存储」和「无限存储」两个权限，不联网、不做统计、不加载远程代码，数据只在你的浏览器里，可以随时导出或清空。

        Xhandy 开源免费，现在是 v0.4.7，从 GitHub 发布页下载：github.com/jackxlabs/xhandy。路线图上接下来是互动队列、灵感清单和导出，之后上架商店。
      en: |-
        If you grow on X by replying and engaging by hand, the hard part is choosing where to spend your replies. You can't tell at a glance which posts are taking off, and checking whether someone follows you back, or how often you've talked, means opening profiles or hovering over avatars.

        Xhandy is a browser extension for Chrome, Edge and Brave that puts those answers next to every post. A small label shows the post's age and views per hour, like "2h · 15K/h": orange from 1,000 views an hour, red from 10,000, grey after 48 hours. Next to it you see whether you follow each other (⇄ mutual, → you follow, ← follows you), how many times you've interacted with the author and when you last did.

        While you type, Xhandy warns you if a reply is very similar to one you sent recently, since repeated replies are what spam filters look for. A small bar shows today's likes, replies, posts and time on X. Alt+U opens a read-only list of accounts that don't follow you back, and Shift+F moves focus to an author's Follow button so you can press Enter yourself.

        Xhandy never clicks, types, sends, likes or follows for you. It asks for two permissions, storage and unlimitedStorage, makes no network requests, runs no analytics and keeps all data in your browser, where you can export or delete it at any time.

        It is free and open source. Version 0.4.7 is on GitHub Releases at github.com/jackxlabs/xhandy. Next on the roadmap: an interaction queue, a local idea list and export, then a store listing.
  house:                     # message house: roof = the one idea, pillars = what holds it up, proof = identity.proof_points claims
    roof:
      zh: "刷 X 时一眼看出该回哪条，每个操作仍由你自己完成"
      en: "See which posts are worth a reply as you scroll X, while every action stays yours"
    pillars:
      - id: at-a-glance
        title: { zh: "一眼看懂", en: "At a glance" }
        message:
          zh: "热度、关系和互动记录放在同一个标签里，标在帖子旁边"
          en: "Heat, relationship and interaction history share one label, right next to the post"
        proof: ["See which posts are taking off", "Remembers where you stand with every author", "All of it in one extension"]
      - id: never-acts
        title: { zh: "从不替你操作", en: "Never acts for you" }
        message:
          zh: "不点击、不发送、不关注；关注助手只把焦点放到 X 自己的按钮上，按键的是你"
          en: "No clicks, no sends, no follows; the follow assistant only moves focus to X's own button and you press the key"
        proof: ["Never acts for you"]
      - id: your-data
        title: { zh: "数据留在你这里", en: "Your data stays with you" }
        message:
          zh: "不联网、不做统计，数据只在你的浏览器里；代码公开，可以自己查"
          en: "No network and no analytics; data lives in your browser, and the code is public for anyone to check"
        proof: ["No network, your data stays in your browser", "Free and open source"]
  faq:                       # grouped by audience; short = one line for replies and DMs, long = docs and press
    users:
      - q: { zh: "用 Xhandy 会不会被封号？", en: "Can Xhandy get my account limited?" }
        short:
          zh: "Xhandy 不替你点击、发送或关注，关注和取关超过每日软上限会提醒你。没有哪个工具能保证账号不被限流。"
          en: "Xhandy never clicks, sends or follows for you, and it reminds you when follows or unfollows pass a daily soft limit. No tool can promise an account won't be limited."
        long:
          zh: "Xhandy 只读取页面和你自己的操作，不点击、不输入、不发送、不点赞、不关注，也不模拟鼠标事件，端到端测试会检查这一点。关注和取关默认每天超过 20 个会提醒（只提醒，不拦截），因为关注太快容易被限流；写回复时，和最近发过的很像也会提醒。账号会不会被限流最终由 X 决定，Xhandy 只能帮你避开最常见的问题。"
          en: "Xhandy only reads the page and your own actions. It never clicks, types, sends, likes or follows, and never fakes mouse events; end-to-end tests check this. By default it reminds you after 20 follows or 20 unfollows a day (a reminder only, nothing is blocked), because following fast is what gets accounts limited, and it warns you when a reply is very similar to a recent one. Whether an account gets limited is X's call; Xhandy helps you avoid the most common causes."
        source: readme
        checked: "2026-10-20"
        status: draft
      - q: { zh: "Xhandy 会收集我的数据吗？", en: "Does Xhandy collect my data?" }
        short:
          zh: "不会。它不联网、不做统计、不加载远程代码，数据只存在你的浏览器里。"
          en: "No. It makes no network requests, runs no analytics and loads no remote code; your data stays in your browser."
        long:
          zh: "Xhandy 只申请「存储」和「无限存储」两个权限，只在 x.com 和 twitter.com 上运行。存在你浏览器里的有：设置、每日计数、每个作者的点赞和回复次数、关注关系，以及你最近 300 条回复和帖子的文字（用来提醒重复回复）。在设置页可以导出、导入或清空全部数据。完整隐私政策见仓库里的 PRIVACY.md。"
          en: "Xhandy has two permissions, storage and unlimitedStorage, and runs only on x.com and twitter.com. What it keeps in your browser: your settings, daily counts, per-author like and reply counts, follow relationships, and the text of your last 300 replies and posts (for the duplicate-reply warning). You can export, import or delete everything from the Options page. The full privacy policy is PRIVACY.md in the repository."
        source: readme
        checked: "2026-10-20"
        status: draft
      - q: { zh: "支持哪些浏览器？怎么安装？", en: "Which browsers does it support, and how do I install it?" }
        short:
          zh: "Chrome、Edge、Brave。从 GitHub 发布页下载压缩包，解压后在 chrome://extensions 打开开发者模式，加载已解压的扩展程序。"
          en: "Chrome, Edge and Brave. Download the zip from GitHub Releases, unzip it, turn on Developer mode in chrome://extensions and choose Load unpacked."
        long:
          zh: "到 github.com/jackxlabs/xhandy 的发布页下载 xhandy-版本号.zip，解压得到 xhandy 文件夹，把它放在以后不会动的位置。在 chrome://extensions 打开开发者模式，点「加载已解压的扩展程序」，选 xhandy 文件夹。更新时解压覆盖原文件夹，再点「重新加载」。不要换文件夹位置：扩展 ID 跟着路径走，换了位置原来的数据就读不到了。"
          en: "Download xhandy-<version>.zip from Releases at github.com/jackxlabs/xhandy and unzip it somewhere it can stay. Open chrome://extensions, turn on Developer mode, click Load unpacked and choose the xhandy folder. To update, unzip the new release over the same folder and click reload. Keep the folder where it is: the extension ID, and with it your data, is tied to the folder's path."
        source: readme
        checked: "2026-10-20"
        status: draft
      - q: { zh: "收费吗？", en: "Is it free?" }
        short: { zh: "免费，代码以 MIT 协议开源。", en: "Yes. The code is open source under the MIT licence." }
        long:
          zh: "Xhandy 免费，源码在 github.com/jackxlabs/xhandy，以 MIT 协议开源。"
          en: "Xhandy is free. The source is at github.com/jackxlabs/xhandy under the MIT licence."
        source: readme
        checked: "2026-10-20"
        status: draft
      - q: { zh: "「没回关我」列表为什么不全？", en: "Why is the \"not following you back\" list incomplete?" }
        short:
          zh: "列表只用你刷 X 时已经加载过的数据。先打开自己的「正在关注」页面滚到底，再按 Alt+U。"
          en: "It only uses data X has already loaded while you scrolled. Open your own Following page, scroll to the bottom once, then press Alt+U."
        long:
          zh: "Xhandy 不额外联网，关系数据来自 X 在你浏览时已经发给浏览器的内容。想要完整名单，打开自己主页的「正在关注」页面一直滚到底，再按 Alt+U。如果你关注的人里一个回关的都没显示，列表会提示 X 可能改了数据，这时别信这份列表。"
          en: "Xhandy makes no extra requests; follow data comes from what X already sends to your browser as you scroll. For the full list, open your own Following page and scroll to the bottom once, then press Alt+U. If none of the accounts you follow shows as following you back, the panel warns that X may have changed its data, so don't trust that list."
        source: readme
        checked: "2026-10-20"
        status: draft
      - q: { zh: "能自动关注或自动回复吗？", en: "Can it follow or reply automatically?" }
        short:
          zh: "不能，以后也不会。Xhandy 只给提示，每个操作都由你自己完成。"
          en: "No, and it won't. Xhandy only shows hints; you take every action yourself."
        long:
